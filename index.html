<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Survival">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4a6b2f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Base de Supervivencia</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#23261f;--mu:#6b6f63;--ac:#4a6b2f;--ac2:#e8eedf;--bd:#d9d5c8;--dn:#a33;--wn:#b36b00;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171a14;--card:#22261d;--tx:#e8eadf;--mu:#9a9f8e;--ac:#8fb85a;--ac2:#2c3324;--bd:#3a4030;--dn:#e77;--wn:#e8a64a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:120px;resize:vertical}
button{cursor:pointer;width:auto}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--dn)}
.r{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.r>*{flex:1;min-width:120px}
label.l{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.it h3{margin:0 0 4px;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.m{font-size:13px;color:var(--mu)}
.tg{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:6px;padding:1px 7px;font-size:12px;margin:3px 4px 0 0}
.ex{color:var(--wn);font-weight:600}.ex.bad{color:var(--dn)}
.dt{display:none;margin-top:8px}
.it.o .dt{display:block}
.bd{white-space:pre-wrap}
.ck{display:flex;gap:8px;align-items:center;padding:5px 0}
.ck input{width:20px;height:20px;flex:none}
.ck.dn span{text-decoration:line-through;color:var(--mu)}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.ph img.big{width:100%;height:auto;max-height:70vh;object-fit:contain}
.pe{position:relative}
.pe button{position:absolute;top:2px;right:2px;padding:0 7px;border-radius:99px}
.ac{display:flex;gap:8px;margin-top:10px}
.f{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 3px 10px #0004}
#ed{display:none}
.em{text-align:center;color:var(--mu);padding:30px 10px}
</style>
</head>
<body>
<div class="w" id="lst">
<h1>🏕️ Base de Supervivencia</h1>
<input id="q" type="search" placeholder="Buscar en títulos, notas, listas y etiquetas…">
<div class="r"><select id="so">
<option value="rec">Más recientes</option>
<option value="az">A → Z</option>
<option value="cat">Por categoría</option>
<option value="fav">Favoritos primero</option>
<option value="exp">Caducidad más próxima</option>
</select></div>
<div class="chips" id="ch"></div>
<div id="ls"></div>
<div class="r" style="margin-top:20px">
<button id="ex">⬇ Exportar copia</button>
<button id="im">⬆ Importar copia</button>
<input type="file" id="fi" accept=".json" hidden>
</div>
<p class="m" id="st"></p>
<button class="p f" id="nw">+ Nueva</button>
</div>

<div class="w" id="ed">
<h1 id="et">Nueva entrada</h1>
<input id="t" placeholder="Título (ej. Botiquín de mochila)">
<label class="l">Categoría</label><select id="c"></select>
<label class="l">Etiquetas (separadas por comas)</label><input id="g">
<label class="l">Notas</label><textarea id="b"></textarea>
<label class="l">Lista de comprobación (un elemento por línea)</label><textarea id="k" style="min-height:90px"></textarea>
<label class="l">Fecha de caducidad (opcional)</label><input id="x" type="date">
<label class="l">Fotos</label>
<div class="ph" id="pe"></div>
<div class="r"><button id="ap">📷 Añadir foto</button></div>
<input type="file" id="pf" accept="image/*" multiple hidden>
<div class="r"><button class="p" id="sv">Guardar</button><button id="cn">Cancelar</button></div>
</div>

<script>
var CATS=["Agua","Fuego","Refugio","Alimentos","Despensa","Primeros auxilios","Navegación","Herramientas","Equipo y mochila","Preparacionismo","Seguridad","Otros"];
var data=[],cat="Todas",editId=null,photos=[],db=null;

/* ---------- almacenamiento (IndexedDB) ---------- */
function idb(cb){try{var r=indexedDB.open("survival",1);
r.onupgradeneeded=function(){r.result.createObjectStore("e",{keyPath:"id"})};
r.onsuccess=function(){db=r.result;var q=db.transaction("e").objectStore("e").getAll();q.onsuccess=function(){data=q.result;cb()};q.onerror=cb};
r.onerror=cb}catch(e){cb()}}
function put(e){try{if(db)db.transaction("e","readwrite").objectStore("e").put(e)}catch(x){}}
function del(id){try{if(db)db.transaction("e","readwrite").objectStore("e").delete(id)}catch(x){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- utilidades ---------- */
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function days(x){if(!x)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(x+"T00:00:00")-t)/864e5)}
function get(id){return data.filter(function(e){return e.id===id})[0]}

/* ---------- lista ---------- */
function chips(){
$("ch").innerHTML=["Todas","★ Favoritos","⏰ Caducan pronto"].concat(CATS).map(function(c){
return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("")}
function render(){
var q=norm($("q").value.trim()),so=$("so").value;
var l=data.filter(function(e){
if(cat==="★ Favoritos"&&!e.fav)return false;
if(cat==="⏰ Caducan pronto"){var d=days(e.x);if(d===null||d>30)return false}
else if(cat!=="Todas"&&cat!=="★ Favoritos"&&e.cat!==cat)return false;
if(!q)return true;
var txt=e.t+" "+e.b+" "+e.g.join(" ")+" "+e.cat+" "+(e.k||[]).map(function(i){return i.t}).join(" ");
return q.split(/\s+/).every(function(w){return norm(txt).indexOf(w)>-1})});
l.sort(function(a,b){
if(so==="az")return a.t.localeCompare(b.t,"es");
if(so==="cat")return a.cat.localeCompare(b.cat,"es")||a.t.localeCompare(b.t,"es");
if(so==="fav")return (b.fav?1:0)-(a.fav?1:0)||b.u-a.u;
if(so==="exp"){if(!a.x&&!b.x)return b.u-a.u;if(!a.x)return 1;if(!b.x)return -1;return a.x<b.x?-1:1}
return b.u-a.u});
$("ls").innerHTML=l.length?l.map(function(e){
var d=days(e.x),ex="";
if(d!==null)ex=' · <span class="ex'+(d<0?' bad':'')+'">'+(d<0?'⚠ Caducada hace '+(-d)+' d':d===0?'⏰ Caduca hoy':'⏰ Caduca en '+d+' d')+'</span>';
var k=(e.k||[]),done=k.filter(function(i){return i.d}).length;
return '<div class="it" data-id="'+e.id+'"><h3><span>'+esc(e.t)+'</span><span>'+(e.fav?'★':'')+'</span></h3>'+
'<div class="m">'+esc(e.cat)+ex+(k.length?' · ✔ '+done+'/'+k.length:'')+(e.p&&e.p.length?' · 📷 '+e.p.length:'')+'</div>'+
e.g.map(function(t){return '<span class="tg">'+esc(t)+'</span>'}).join("")+
'<div class="dt">'+(e.b?'<div class="bd">'+esc(e.b)+'</div>':'')+
k.map(function(i,n){return '<label class="ck'+(i.d?' dn':'')+'"><input type="checkbox" data-n="'+n+'"'+(i.d?' checked':'')+'><span>'+esc(i.t)+'</span></label>'}).join("")+
(e.p&&e.p.length?'<div class="ph">'+e.p.map(function(s){return '<img src="'+s+'">'}).join("")+'</div>':'')+
'<div class="ac"><button data-a="f">'+(e.fav?'Quitar ★':'★ Favorito')+'</button><button data-a="e">Editar</button><button class="d" data-a="x">Borrar</button></div></div></div>'}).join(""):
'<div class="em">'+(data.length?'Sin resultados.':'Aún no hay entradas. Pulsa «+ Nueva» para empezar.')+'</div>';
$("st").textContent=data.length+" entradas · guardadas en este dispositivo"}

/* ---------- editor ---------- */
function show(ed){$("lst").style.display=ed?"none":"block";$("ed").style.display=ed?"block":"none";window.scrollTo(0,0)}
function drawPh(){$("pe").innerHTML=photos.map(function(s,i){return '<div class="pe"><img src="'+s+'"><button data-p="'+i+'">✕</button></div>'}).join("")}
function openEd(id){
editId=id;var e=id?get(id):null;
$("et").textContent=e?"Editar entrada":"Nueva entrada";
$("t").value=e?e.t:"";$("c").value=e?e.cat:(CATS.indexOf(cat)>-1?cat:CATS[0]);
$("g").value=e?e.g.join(", "):"";$("b").value=e?e.b:"";
$("k").value=e&&e.k?e.k.map(function(i){return i.t}).join("\n"):"";
$("x").value=e&&e.x?e.x:"";photos=e&&e.p?e.p.slice():[];drawPh();show(true)}
function resize(file,cb){
var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
cb(c.toDataURL("image/jpeg",0.8))};im.src=r.result};r.readAsDataURL(file)}

$("c").innerHTML=CATS.map(function(c){return "<option>"+c+"</option>"}).join("");
$("ch").onclick=function(ev){var c=ev.target.getAttribute("data-c");if(c){cat=c;chips();render()}};
$("q").oninput=render;$("so").onchange=render;
$("nw").onclick=function(){openEd(null)};
$("cn").onclick=function(){show(false)};
$("ap").onclick=function(){$("pf").click()};
$("pf").onchange=function(){Array.prototype.forEach.call(this.files,function(f){resize(f,function(s){photos.push(s);drawPh()})});this.value=""};
$("pe").onclick=function(ev){var p=ev.target.getAttribute("data-p");if(p!==null){photos.splice(+p,1);drawPh()}};
$("sv").onclick=function(){
var t=$("t").value.trim();if(!t){$("t").focus();return}
var g=$("g").value.split(",").map(function(s){return s.trim()}).filter(Boolean);
var old=editId?get(editId):null,oldK=old&&old.k||[];
var k=$("k").value.split("\n").map(function(s){return s.trim()}).filter(Boolean).map(function(s){
var m=oldK.filter(function(i){return i.t===s})[0];return{t:s,d:m?m.d:false}});
var e=old||{id:"i"+Date.now(),fav:false};
e.t=t;e.cat=$("c").value;e.g=g;e.b=$("b").value;e.k=k;e.x=$("x").value;e.p=photos;e.u=Date.now();
if(!old)data.push(e);put(e);show(false);render()};

/* ---------- acciones en tarjetas ---------- */
$("ls").onclick=function(ev){
var it=ev.target.closest(".it");if(!it)return;
var id=it.getAttribute("data-id"),e=get(id),tg=ev.target;
if(tg.type==="checkbox"){e.k[+tg.getAttribute("data-n")].d=tg.checked;put(e);
tg.parentNode.classList.toggle("dn",tg.checked);return}
if(tg.tagName==="IMG"){tg.classList.toggle("big");return}
var a=tg.getAttribute("data-a");
if(!a){if(!tg.closest(".dt"))it.classList.toggle("o");return}
if(a==="e")return openEd(id);
if(a==="f"){e.fav=!e.fav;put(e)}
if(a==="x"){if(!confirm("¿Borrar esta entrada?"))return;data=data.filter(function(x){return x.id!==id});del(id)}
render();var n=document.querySelector('[data-id="'+id+'"]');if(n&&a==="f")n.classList.add("o")};

/* ---------- copia de seguridad ---------- */
$("ex").onclick=function(){
var b=new Blob([JSON.stringify(data)],{type:"application/json"}),a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download="survival-base-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(){
var f=this.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{var n=JSON.parse(r.result),ids={};data.forEach(function(e){ids[e.id]=1});
var add=n.filter(function(e){return e&&e.t&&e.id&&!ids[e.id]}).map(function(e){e.g=e.g||[];e.b=e.b||"";return e});
add.forEach(function(e){data.push(e);put(e)});render();alert("Importadas "+add.length+" entradas.")}
catch(x){alert("Archivo no válido.")}};r.readAsText(f);this.value=""};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
chips();idb(render);
</script>
</body>
</html>
