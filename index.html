<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#23261f;--mu:#6b6f63;--ac:#4a6b2f;--ac2:#e8eedf;--bd:#d9d5c8;--dn:#a33;--wn:#b36b00;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171a14;--card:#22261d;--tx:#e8eadf;--mu:#9a9f8e;--ac:#8fb85a;--ac2:#2c3324;--bd:#3a4030;--dn:#e77;--wn:#e8a64a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:120px;resize:vertical}
button{cursor:pointer;width:auto}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--dn)}
.r{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.r>*{flex:1;min-width:120px}
label.l{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;border-radius:99px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{position:relative;min-height:150px;margin-bottom:12px;padding:14px;border-radius:14px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(#0002,#000b),url(banner.jpg) center/cover,var(--ac)}
.hero h1{margin:0;text-shadow:0 1px 4px #000a}
.mn{position:absolute;top:10px;right:10px;width:auto;padding:6px 11px;border:none;border-radius:99px;background:#0007;color:#fff;font-size:18px}
.mp{display:none;gap:8px;margin-bottom:10px}.mp.on{display:flex;flex-wrap:wrap}.mp button{flex:1 1 40%}
.rt{line-height:1.5}.rt ul,.rt ol{margin:6px 0;padding-left:22px}.rt h3{margin:10px 0 4px;font-size:17px}
.rt ul.todo{list-style:none;padding-left:2px}.rt ul.todo li{position:relative;padding-left:28px;list-style:none}
.rt ul.todo input{position:absolute;left:2px;top:3px;width:20px;height:20px}
.rt ul.todo li:has(input:checked){color:var(--mu);text-decoration:line-through}
.rt table{border-collapse:collapse;margin:8px 0;max-width:100%;display:block;overflow-x:auto}
.rt td,.rt th{border:1px solid var(--bd);padding:5px 8px;min-width:60px;vertical-align:top;text-align:left}.rt th{background:var(--ac2)}
.ed{min-height:180px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--card);outline:none}
.tb{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tb button{white-space:nowrap;padding:6px 10px;font-size:14px}
.bk{display:none;background:var(--ac2);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}.bk button{padding:4px 10px;margin-left:6px}
body.red{--bg:#000;--card:#120000;--tx:#ff4040;--mu:#b03030;--ac:#a00;--ac2:#240000;--bd:#400;--dn:#f66;--wn:#f84}
body.red .hero{filter:grayscale(1) sepia(1) hue-rotate(-50deg) saturate(3) brightness(.6)}
body.big{font-size:20px}body.big .m,body.big .chip,body.big .tb button{font-size:16px}
#pv{display:none}
@media print{body.pr>*:not(#pv){display:none!important}body.pr #pv{display:block}body.pr,body.pr.red{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#999;--ac2:#eee;background:#fff;color:#000}.pi{break-inside:avoid;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #999}.pi h2{margin:0 0 4px}}
.chip.s{font-size:13px;padding:3px 10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.it h3{margin:0 0 4px;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.m{font-size:13px;color:var(--mu)}
.tg{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:6px;padding:1px 7px;font-size:12px;margin:3px 4px 0 0}
.ex{color:var(--wn);font-weight:600}.ex.bad{color:var(--dn)}
.dt{display:none;margin-top:8px}
.it.o .dt{display:block}
.bd{white-space:pre-wrap}
.ck{display:flex;gap:8px;align-items:center;padding:5px 0}
.ck input{width:20px;height:20px;flex:none}
.ck.dn span{text-decoration:line-through;color:var(--mu)}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.ph img.big{width:100%;height:auto;max-height:70vh;object-fit:contain}
.pe{position:relative}
.pe button{position:absolute;top:2px;right:2px;padding:0 7px;border-radius:99px}
.ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.f{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 3px 10px #0004}
#ed{display:none}
.em{text-align:center;color:var(--mu);padding:30px 10px}

<body>
<div class="w" id="lst">

</div>

<script>
var TREE={"Supervivencia básica":["Agua","Fuego","Refugio","Alimentos","Huerto y semillas","Higiene"],"Salud":["Primeros auxilios","Medicinas","Mente y salud mental"],"Equipo":["Mochila 72 h","Almacén en casa","Energía","Herramientas"],"Información":["Comunicaciones","Mapas y rutas","Meteorología","Contactos"],"Amenazas y planes":["Nuclear","Guerra y conflicto","Guerra híbrida","Ciberataques","Apagones","Desastres naturales","Plan familiar","Evacuación"],"Seguridad y discreción":["Defensa","VPN","Gray man"],"Documentos y dinero":["Lifebook","Efectivo y trueque"],"Bushcraft":["Nudos","Plantas","Rastros","Navegación natural"],"Otros":[]};
var SRC={"notion":"Notion","compilacion":"Compilación Twitter"};
var CATS=Object.keys(TREE);
var data=[],cat="Todas",sub="",editId=null,photos=[],db=null;

/* ---------- almacenamiento (IndexedDB) ---------- */
function idb(cb){try{var r=indexedDB.open("survival",1);
r.onupgradeneeded=function(){r.result.createObjectStore("e",{keyPath:"id"})};
r.onsuccess=function(){db=r.result;var q=db.transaction("e").objectStore("e").getAll();q.onsuccess=function(){data=q.result;cb()};q.onerror=cb};
r.onerror=cb}catch(e){cb()}}
function put(e){try{if(db)db.transaction("e","readwrite").objectStore("e").put(e)}catch(x){}}
function del(id){try{if(db)db.transaction("e","readwrite").objectStore("e").delete(id)}catch(x){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- utilidades ---------- */
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function days(x){if(!x)return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(x+"T00:00:00")-t)/864e5)}
function get(id){return data.filter(function(e){return e.id===id})[0]}

/* ---------- lista ---------- */
function chips(){
function mk(c,on,a,l){return '<button class="chip'+(on?' on':'')+(a?' s':'')+'" data-'+(a?'s':'c')+'="'+esc(c)+'">'+esc(l||c)+'</button>'}
$("ch").innerHTML=["Todas","★ Favoritos","⏰ Caducan pronto","📦 Stock bajo","📚 Guías"].concat(CATS).map(function(c){return mk(c,c===cat)}).join("");
var L=[];
if(cat==="📚 Guías")L=Object.keys(SRC).map(function(k){return[k,SRC[k]]});
else if(TREE[cat])L=TREE[cat].map(function(x){return[x,x]});
$("sch").innerHTML=L.length?[["","Todas"]].concat(L).map(function(q){return mk(q[0],q[0]===sub,1,q[1])}).join(""):""}
function render(){
var q=norm($("q").value.trim()),so=$("so").value;
var l=data.filter(function(e){
if(cat==="★ Favoritos"&&!e.fav)return false;
if(cat==="⏰ Caducan pronto"){var d=days(e.x);if(d===null||d>30)return false}
else if(cat==="📦 Stock bajo"){if(!isLow(e))return false}
else if(cat==="📚 Guías"){if(!e.src||(sub&&e.src!==sub))return false}
else if(cat!=="Todas"&&cat!=="★ Favoritos"){if(kc(e)!==cat||(sub&&e.sub!==sub))return false}
if(!q)return true;
var txt=e.t+" "+e.b+" "+e.g.join(" ")+" "+e.cat+" "+(e.k||[]).map(function(i){return i.t}).join(" ");
return q.split(/\s+/).every(function(w){return norm(txt).indexOf(w)>-1})});
l.sort(function(a,b){
if(so==="az")return a.t.localeCompare(b.t,"es");
if(so==="cat")return a.cat.localeCompare(b.cat,"es")||a.t.localeCompare(b.t,"es");
if(so==="fav")return (b.fav?1:0)-(a.fav?1:0)||b.u-a.u;
if(so==="rev")return (a.rev||0)-(b.rev||0);
if(so==="exp"){if(!a.x&&!b.x)return b.u-a.u;if(!a.x)return 1;if(!b.x)return -1;return a.x<b.x?-1:1}
return b.u-a.u});
cur=l;
$("ls").innerHTML=l.length?l.map(function(e){
var d=days(e.x),ex="";
if(d!==null)ex=' · <span class="ex'+(d<0?' bad':'')+'">'+(d<0?'⚠ Caducada hace '+(-d)+' d':d===0?'⏰ Caduca hoy':'⏰ Caduca en '+d+' d')+'</span>';
var k=(e.k||[]),done=k.filter(function(i){return i.d}).length,tt=k.length,dd=done;if(e.h){tt+=(e.h.match(/<input/g)||[]).length;dd+=(e.h.match(/<input[^>]*checked/g)||[]).length}
var inv=(e.qty!==undefined&&e.qty!==""?" · 📦 "+e.qty+(e.loc?" · "+esc(e.loc):""):(e.loc?" · 📍 "+esc(e.loc):""))+(isLow(e)?' · <span class="ex bad">⚠ Stock bajo</span>':""),rv=e.rev?" · 🔄 revisada hace "+ago(e.rev):"";
return '<div class="it" data-id="'+e.id+'"><h3><span>'+esc(e.t)+'</span><span>'+(e.fav?'★':'')+'</span></h3>'+
'<div class="m">'+esc(kc(e))+(e.sub?" › "+esc(e.sub):"")+(e.src?" · 📚 "+esc(SRC[e.src]||e.src):"")+ex+inv+rv+(tt?' · ✔ '+dd+'/'+tt:'')+(e.p&&e.p.length?' · 📷 '+e.p.length:'')+'</div>'+
e.g.map(function(t){return '<span class="tg">'+esc(t)+'</span>'}).join("")+
'<div class="dt">'+(e.h?'<div class="rt">'+clean(e.h)+'</div>':(e.b?'<div class="bd">'+esc(e.b)+'</div>':''))+
k.map(function(i,n){return '<label class="ck'+(i.d?' dn':'')+'"><input type="checkbox" data-n="'+n+'"'+(i.d?' checked':'')+'><span>'+esc(i.t)+'</span></label>'}).join("")+
(e.p&&e.p.length?'<div class="ph">'+e.p.map(function(s){return '<img src="'+s+'">'}).join("")+'</div>':'')+
'<div class="ac"><button data-a="f">'+(e.fav?'Quitar ★':'★ Favorito')+'</button><button data-a="v">✓ Revisada</button><button data-a="d">Duplicar</button><button data-a="p">🖨 Imprimir</button><button data-a="e">Editar</button><button class="d" data-a="x">Borrar</button></div></div></div>'}).join(""):
'<div class="em">'+(data.length?'Sin resultados.':'Aún no hay entradas. Pulsa «+ Nueva» para empezar.')+'</div>';
$("st").textContent=data.length+" entradas · guardadas en este dispositivo · versión "+VER}

/* ---------- editor ---------- */
function show(ed){$("lst").style.display=ed?"none":"block";$("ed").style.display=ed?"block":"none";$("pn").style.display="none";window.scrollTo(0,0)}
function drawPh(){$("pe").innerHTML=photos.map(function(s,i){return '<div class="pe"><img src="'+s+'"><button data-p="'+i+'">✕</button></div>'}).join("")}
function openEd(id){
editId=id;var e=id?get(id):null;
$("et").textContent=e?"Editar entrada":"Nueva entrada";
$("t").value=e?e.t:"";$("c").value=e?kc(e):(CATS.indexOf(cat)>-1?cat:CATS[0]);fillSub($("c").value,e?e.sub:(CATS.indexOf(cat)>-1?sub:""));
$("g").value=e?e.g.join(", "):"";$("bd").innerHTML=e?(e.h?clean(e.h):toHtml(e)):"";
$("x").value=e&&e.x?e.x:"";$("qy").value=e&&e.qty!==undefined?e.qty:"";$("mn2").value=e&&e.min!==undefined?e.min:"";$("lc").value=e&&e.loc?e.loc:"";$("tp").style.display=e?"none":"";$("tp").value="";photos=e&&e.p?e.p.slice():[];drawPh();show(true)}
function resize(file,cb){
var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
var m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
cb(c.toDataURL("image/jpeg",0.8))};im.src=r.result};r.readAsDataURL(file)}

var OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,H3:1,P:1,DIV:1,BR:1,UL:1,OL:1,LI:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,INPUT:1,SPAN:1};
function clean(h){var d=new DOMParser().parseFromString("<body>"+(h||"")+"</body>","text/html").body;
(function w(n){Array.prototype.slice.call(n.childNodes).forEach(function(c){
if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return}
if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META)$/.test(c.tagName)){c.remove();return}
w(c);
if(!OK[c.tagName]){while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove();return}
var todo=c.tagName==="UL"&&c.classList.contains("todo"),inp=c.tagName==="INPUT",ok=inp&&c.type==="checkbox",chk=ok&&c.hasAttribute("checked");
if(inp&&!ok){c.remove();return}
Array.prototype.slice.call(c.attributes).forEach(function(a){c.removeAttribute(a.name)});
if(todo)c.className="todo";if(ok){c.type="checkbox";if(chk)c.setAttribute("checked","")}})})(d);return d.innerHTML}
function toHtml(e){var h=e.b?esc(e.b).replace(/\n/g,"<br>"):"";
if(e.k&&e.k.length)h+=(h?"<br>":"")+'<ul class="todo">'+e.k.map(function(i){return'<li><input type="checkbox"'+(i.d?' checked':'')+'> '+esc(i.t)+'</li>'}).join("")+'</ul>';return h}
function tbl(c){var s=getSelection(),n=s.rangeCount&&s.anchorNode;n=n&&(n.nodeType===1?n:n.parentNode);var td=n&&n.closest("td,th");
if(!td||!$("bd").contains(td)){alert("Pon el cursor dentro de una tabla.");return}
var t=td.closest("table"),tr=td.parentNode;
if(c==="delt"){if(confirm("¿Borrar la tabla?"))t.remove();return}
if(c==="row"){var nr=document.createElement("tr");Array.prototype.forEach.call(tr.children,function(){var x=document.createElement("td");x.innerHTML="&nbsp;";nr.appendChild(x)});tr.parentNode.insertBefore(nr,tr.nextSibling)}
else{var i=Array.prototype.indexOf.call(tr.children,td);Array.prototype.forEach.call(t.rows,function(r){var x=document.createElement(r.rowIndex?"td":"th");x.innerHTML="&nbsp;";r.insertBefore(x,r.children[i+1]||null)})}}
$("tb").onmousedown=function(ev){ev.preventDefault()};
$("tb").onclick=function(ev){var b=ev.target.closest("button");if(!b)return;var c=b.getAttribute("data-c"),x=document.execCommand.bind(document);$("bd").focus();x("styleWithCSS",false,false);
if(c==="h")x("formatBlock",false,document.queryCommandValue("formatBlock")==="h3"?"p":"h3");
else if(c==="todo")x("insertHTML",false,'<ul class="todo"><li><input type="checkbox">&nbsp;</li></ul>');
else if(c==="table"){var r=+prompt("¿Cuántas filas?","3"),k=+prompt("¿Cuántas columnas?","3");
if(r>0&&k>0&&r<30&&k<10){var t="<table>";for(var i=0;i<r;i++){t+="<tr>";for(var j=0;j<k;j++)t+=(i?"<td>":"<th>")+"&nbsp;"+(i?"</td>":"</th>");t+="</tr>"}x("insertHTML",false,t+"</table><p><br></p>")}}
else if(c==="row"||c==="col"||c==="delt")tbl(c);
else x(c)};
$("bd").onkeyup=function(ev){if(ev.key!=="Enter")return;var n=getSelection().anchorNode,li=n&&(n.nodeType===1?n:n.parentNode).closest("li");
if(li&&li.parentNode.classList.contains("todo")&&!li.querySelector("input")){var i=document.createElement("input");i.type="checkbox";li.insertBefore(i,li.firstChild)}};
var cur=[],VER="5";
function lsGet(k){try{return localStorage.getItem(k)}catch(x){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(x){}}
function isLow(e){return e.qty!==undefined&&e.qty!==""&&e.min!==undefined&&e.min!==""&&+e.qty<+e.min}
function ago(t){var d=Math.floor((Date.now()-t)/864e5);return d<1?"hoy":d<60?d+" d":Math.floor(d/30)+" meses"}
function bkBanner(){var b=$("bk"),l=+lsGet("lastBackup")||0,d=Math.floor((Date.now()-l)/864e5);
if(!data.length||(l&&d<30)||lsGet("bkHide")===new Date().toDateString()){b.style.display="none";return}
b.innerHTML="💾 "+(l?"Hace "+d+" días que no exportas una copia.":"Aún no has exportado ninguna copia.")+' <button id="bk1">Exportar</button><button id="bk2">Luego</button>';b.style.display="block"}
function doExport(){var b=new Blob([JSON.stringify(data)],{type:"application/json"}),n="survival-base-"+new Date().toISOString().slice(0,10)+".json",f;
